services:
  - type: web
    name: dyp-farms-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    branch: main
    autoDeploy: true
    # NODE_ENV=production makes `npm install` skip devDependencies (typescript,
    # prisma, @types/*), which nest build and prisma generate both need — see
    # commit dd1205f. --include=dev overrides that during the build step only;
    # the running process still gets NODE_ENV=production from envVars below.
    # This already matches the Build/Start Command configured by hand on the
    # live service.
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      # --- Safe to manage here: derived from the service's own identity, or
      # infra plumbing that isn't a secret. ---
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      # Neon Postgres (free tier doesn't expire; Render's free Postgres does after 30
      # days). Set both in the Render dashboard — see backend/prisma/README.md.
      - key: DATABASE_URL # pooled Neon URL, used at runtime
        sync: false
      - key: DIRECT_URL # direct Neon URL, used by `prisma migrate deploy`
        sync: false
      - key: API_PUBLIC_URL
        value: https://dyp-farms-api.onrender.com/api
      - key: MTN_MOMO_CALLBACK_URL
        value: https://dyp-farms-api.onrender.com/api/webhooks/mtn-momo
      - key: AIRTEL_CALLBACK_URL
        value: https://dyp-farms-api.onrender.com/api/webhooks/airtel-money
      - key: GEMINI_VISION_MODEL
        value: gemini-2.0-flash

      # --- sync: false below: this CLI/blueprint has no way to read what's
      # currently set on the live service, and a static `value:` here would
      # force-overwrite it (back to these defaults) on every blueprint sync.
      # Set real values once in the Render dashboard; they're left alone
      # after that. ---
      - key: JWT_SECRET
        sync: false
      - key: PAYMENTS_MOCK
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # MTN MoMo (https://momodeveloper.mtn.com)
      - key: MTN_MOMO_SUBSCRIPTION_KEY
        sync: false
      - key: MTN_MOMO_API_USER
        sync: false
      - key: MTN_MOMO_API_KEY
        sync: false
      - key: MTN_MOMO_TARGET_ENV
        sync: false
      # Airtel Money (https://developers.airtel.africa)
      - key: AIRTEL_CLIENT_ID
        sync: false
      - key: AIRTEL_CLIENT_SECRET
        sync: false
      - key: AIRTEL_PIN
        sync: false
      - key: AIRTEL_COUNTRY
        sync: false
      # Gemini vision (https://aistudio.google.com/apikey)
      - key: GEMINI_API_KEY
        sync: false
      # Only needed if the AI chat module actually calls OpenAI
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: dyp-farms-web
    runtime: static
    rootDir: web
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # SPA fallback so react-router client-side routes (e.g. /admin/farms) don't 404 on refresh.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://dyp-farms-api.onrender.com/api
      # Needed for the farmer "Add Farm" map and the admin Farms Map; both pages
      # degrade gracefully (name-only farm creation / a text list) without it.
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
